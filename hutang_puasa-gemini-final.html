<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#085041">
<title>Hutang Puasa Apps Sync v4.2</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#1D9E75;--teal-dark:#085041;
  --amber:#BA7517;--bg:#F7F9F8;--card:#FFFFFF;--text:#1a1a1a;--sub:#6B7280;--border:#E5EBE8;
  --blue:#3B82F6;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
.app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}

.header{background:linear-gradient(135deg,#085041 0%,#1D9E75 60%,#0F6E56 100%);padding:15px 20px;flex-shrink:0}
.header-top{display:flex;justify-content:center;align-items:center;margin-bottom:10px}
.bismillah{font-family:'Amiri',serif;color:rgba(255,255,255,0.9);font-size:22px;text-align:center}
.header-title{color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:10px}

.stats-container{margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height: 120px; overflow-y: auto; padding-right:5px}
.prog-row{background:rgba(255,255,255,0.12); border-radius:10px; padding:6px 10px; color:#fff}
.prog-info{display:flex; justify-content:space-between; font-size:10px; margin-bottom:3px; font-weight:600}
.prog-detail{display:flex; gap:8px; font-size:9px; opacity:0.9; margin-top:2px}
.prog-bar-bg{height:5px; background:rgba(255,255,255,0.2); border-radius:10px; overflow:hidden}
.prog-bar-fill{height:100%; background:#fff; border-radius:10px; transition:width 0.5s}

.tabs{display:flex;margin:10px 14px 0;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--border);flex-shrink:0; overflow-x:auto}
.tab{flex:1;padding:8px 5px;text-align:center;border-radius:9px;font-size:10px;font-weight:600;cursor:pointer;color:var(--sub); min-width:70px}
.tab.active{background:var(--teal);color:#fff}

.content{flex:1;overflow-y:auto;padding:15px;padding-bottom:100px}
.log-item{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--border);margin-bottom:10px;position:relative}
.badge-name{position:absolute;top:12px;right:12px;font-size:9px;padding:3px 8px;border-radius:20px;font-weight:700; background:var(--teal-light); color:var(--teal)}

.log-actions{display:flex;gap:8px;margin-top:10px}
.log-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;background:#fff}
.btn-done{background:var(--teal);color:#fff;border:none}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:10px;max-width:480px;margin:0 auto}
.nav-item{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--sub);cursor:pointer}
.nav-item.active{color:var(--teal)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:340px;max-height:85vh;overflow-y:auto}

input, select, textarea{width:100%;padding:10px;margin-top:5px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px}
label{font-size:11px;font-weight:700;color:var(--sub);margin-top:10px;display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;display:none;z-index:2000}

/* Chat & Emoji */
.chat-container{display:flex;flex-direction:column;height:100%}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px; line-height:1.4}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:2px}
.msg.other{align-self:flex-start;background:#e5e7eb;color:var(--text);border-bottom-left-radius:2px}
.emoji-picker{display:grid; grid-template-columns: repeat(6, 1fr); gap:8px; font-size:20px; text-align:center; padding:10px}
.emoji-btn{cursor:pointer; padding:5px; border-radius:5px}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
    </div>
    <div class="header-title">📿 Hutang Puasa Apps</div>
    <div class="stats-container" id="dashboard-stats"></div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-catat" onclick="setTab('catat')">✏️ Catat</div>
    <div class="tab" id="tab-log" onclick="setTab('log')">📋 Riwayat</div>
    <div class="tab" id="tab-activity" onclick="setTab('activity')">🕒 Log</div>
    <div class="tab" id="tab-chat" onclick="setTab('chat')">💬 Chat</div>
    <div class="tab" id="tab-sync" onclick="setTab('sync')">☁️ Cloud</div>
  </div>

  <div class="content" id="main-content"></div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="setTab('catat')">🏠 Home</div>
    <div class="nav-item" onclick="exportToExcel()">📊 Excel</div>
    <div class="nav-item" onclick="setTab('sync')">⚙️ Settings</div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// KONFIGURASI FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDDLpfpWzmwAS5-oeFW8jyq4Y7YZsVo4-g",
  authDomain: "hutang-puasa.firebaseapp.com",
  databaseURL: "https://hutang-puasa-default-rtdb.firebaseio.com",
  projectId: "hutang-puasa",
  storageBucket: "hutang-puasa.firebasestorage.app",
  messagingSenderId: "889099979356",
  appId: "1:889099979356:web:9b1481ec46da4425a57499"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let records = JSON.parse(localStorage.getItem('hp_v4_data') || '[]');
let profiles = JSON.parse(localStorage.getItem('hp_profiles') || '["Ayah", "Bunda"]');
let activities = JSON.parse(localStorage.getItem('hp_activities') || '[]');
let syncId = localStorage.getItem('hp_sync_id') || '';
let myName = localStorage.getItem('hp_user_name') || 'Ayah';
let currentTab = 'catat';

const emojis = ["😊","😇","🙏","👍","✨","🌙","⭐","🕋","🕌","📅","✅","❌","💪","❤️","🤲","😅","😭","🥘","🥤","🍰"];

function save(actionDesc) {
    localStorage.setItem('hp_v4_data', JSON.stringify(records));
    localStorage.setItem('hp_profiles', JSON.stringify(profiles));
    
    if(actionDesc) {
        const log = { user: myName, action: actionDesc, time: Date.now() };
        activities.unshift(log);
        if(activities.length > 100) activities.pop();
        localStorage.setItem('hp_activities', JSON.stringify(activities));
    }

    if (syncId) {
        db.ref('sync/' + syncId + '/data').set({
            records: records,
            profiles: profiles,
            activities: activities
        });
    }
    updateStats();
}

function updateStats() {
    const dash = document.getElementById('dashboard-stats');
    let html = '';
    profiles.forEach(p => {
        const total = records.filter(r => r.owner === p).length;
        const lunas = records.filter(r => r.owner === p && r.status === 'done').length;
        const hutang = total - lunas;
        const persen = total > 0 ? Math.round((lunas / total) * 100) : 0;
        html += `
            <div class="prog-row">
                <div class="prog-info"><span>${p}</span><span>${persen}%</span></div>
                <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${persen}%"></div></div>
                <div class="prog-detail">
                    <span>Hutang: ${total}</span> | <span>Lunas: ${lunas}</span> | <span style="font-weight:700">Sisa: ${hutang}</span>
                </div>
            </div>
        `;
    });
    dash.innerHTML = html;
}

function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    renderContent();
}

function renderContent() {
    const c = document.getElementById('main-content');
    if (currentTab === 'catat') {
        c.innerHTML = `
            <div style="background:#fff; padding:15px; border-radius:14px; border:1px solid var(--border)">
                <h4 style="margin-bottom:10px">Catat Hutang Baru</h4>
                <label>Hutang Milik Siapa?</label>
                <select id="f-owner">${profiles.map(p => `<option value="${p}" ${myName === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
                <label>Tanggal Terhutang</label>
                <input type="date" id="f-date" value="${new Date().toISOString().split('T')[0]}">
                <label>Tahun Ramadan</label>
                <input type="number" id="f-year" value="${new Date().getFullYear()}">
                <label>Catatan (Opsional)</label>
                <textarea id="f-note" placeholder="Alasan berhalangan..."></textarea>
                <button onclick="addRecord()" style="width:100%; padding:15px; margin-top:20px; background:var(--teal); color:#fff; border:none; border-radius:10px; font-weight:700">Simpan Catatan</button>
            </div>
        `;
    } else if (currentTab === 'log') {
        let html = records.sort((a,b) => b.id - a.id).map(r => `
            <div class="log-item" style="border-left: 4px solid ${r.status==='done'?'var(--teal)':'var(--amber)'}">
                <span class="badge-name">${r.owner}</span>
                <div style="font-weight:700">${formatDate(r.date)}</div>
                <div style="font-size:11px; color:var(--sub)">Ramadan ${r.year} | ${r.status==='done'?'Lunas':'Hutang'}</div>
                ${r.note ? `<div style="font-size:11px; font-style:italic; margin-top:4px; color:#555">"${r.note}"</div>` : ''}
                ${r.finishDate ? `<div style="font-size:10px; color:var(--teal); margin-top:4px">✓ Selesai: ${formatDate(r.finishDate)}</div>` : ''}
                <div class="log-actions">
                    ${r.status==='hutang' ? `<button class="log-btn btn-done" onclick="openFinishModal(${r.id})">Selesai</button>` : ''}
                    <button class="log-btn" style="color:var(--blue)" onclick="openEditModal(${r.id})">Edit</button>
                    <button class="log-btn" style="color:red" onclick="deleteRecord(${r.id})">Hapus</button>
                </div>
            </div>
        `).join('');
        c.innerHTML = html || '<center style="color:#999; margin-top:40px">Belum ada riwayat</center>';
    } else if (currentTab === 'activity') {
        let html = activities.map(a => `
            <div style="font-size:12px; padding:10px; border-bottom:1px solid var(--border)">
                <span style="font-weight:700; color:var(--teal)">${a.user}</span> ${a.action}
                <div style="font-size:10px; color:#999">${new Date(a.time).toLocaleString('id-ID')}</div>
            </div>
        `).join('');
        c.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <h4>Riwayat Aktivitas</h4>
            <button onclick="exportLog()" style="font-size:10px; padding:5px 10px; border-radius:5px; border:1px solid var(--teal); background:none; color:var(--teal); font-weight:700">Export Log</button>
        </div>` + (html || '<center>Belum ada aktivitas</center>');
    } else if (currentTab === 'chat') {
        if(!syncId) { c.innerHTML = '<center style="padding:40px">Set Sync ID dulu di tab Cloud.</center>'; return; }
        c.innerHTML = `
            <div class="chat-container">
                <div class="chat-messages" id="chat-msgs"></div>
                <div id="emoji-panel" style="display:none; background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:5px">
                    <div class="emoji-picker">${emojis.map(e => `<span class="emoji-btn" onclick="insertEmoji('${e}')">${e}</span>`).join('')}</div>
                </div>
                <div class="chat-input-area" style="display:flex; gap:8px; padding-top:10px">
                    <button onclick="toggleEmoji()" style="background:#eee; border:none; padding:10px; border-radius:10px">😊</button>
                    <input type="text" id="chat-input" placeholder="Kirim pesan...">
                    <button onclick="sendChat()" style="background:var(--teal); color:#fff; border:none; padding:10px 15px; border-radius:10px">Kirim</button>
                </div>
            </div>`;
        setTimeout(listenChat, 100);
    } else if (currentTab === 'sync') {
        c.innerHTML = `
            <div style="background:#fff; padding:15px; border-radius:14px; border:1px solid var(--border); margin-bottom:15px">
                <label>ID Keluarga (Sync ID)</label>
                <input type="text" id="sync-input" value="${syncId}" placeholder="Contoh: keluarga-cemara">
                <label>Nama Anda di Aplikasi</label>
                <select id="name-input">${profiles.map(p => `<option value="${p}" ${myName === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
                <button onclick="applySync()" style="width:100%; padding:15px; margin-top:20px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-weight:700">Update Settings</button>
            </div>
            <div style="background:#fff; padding:15px; border-radius:14px; border:1px solid var(--border)">
                <h4>Kelola Profil</h4>
                <div id="prof-list" style="margin:10px 0">${profiles.map(p => `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #eee"><span>${p}</span> <span onclick="removeProfile('${p}')" style="color:red; cursor:pointer">Hapus</span></div>`).join('')}</div>
                <input type="text" id="new-prof-name" placeholder="Nama anggota baru...">
                <button onclick="addProfile()" style="width:100%; padding:10px; margin-top:10px; border:1px solid var(--teal); color:var(--teal); background:none; border-radius:8px; font-weight:700">+ Tambah Profil</button>
            </div>
        `;
    }
}

function addRecord() {
    const owner = document.getElementById('f-owner').value;
    const date = document.getElementById('f-date').value;
    const year = document.getElementById('f-year').value;
    records.push({
        id: Date.now(), owner: owner, date: date, year: year,
        note: document.getElementById('f-note').value, status: 'hutang', finishDate: null
    });
    save(`mencatat hutang puasa baru untuk ${owner} (${formatDate(date)})`);
    showToast("Catat hutang puasa telah berhasil!");
}

function openEditModal(id) {
    const r = records.find(x => x.id === id);
    const m = document.getElementById('modal');
    m.style.display = 'flex';
    document.getElementById('modal-content').innerHTML = `
        <h4>Edit Data</h4>
        <label>Pemilik</label>
        <select id="e-owner">${profiles.map(p => `<option value="${p}" ${r.owner===p?'selected':''}>${p}</option>`).join('')}</select>
        <label>Tanggal ${r.status==='done'?'Pelunasan':'Hutang'}</label>
        <input type="date" id="e-date" value="${r.status==='done'?r.finishDate:r.date}">
        <label>Status</label>
        <select id="e-status">
            <option value="hutang" ${r.status==='hutang'?'selected':''}>Masih Hutang</option>
            <option value="done" ${r.status==='done'?'selected':''}>Sudah Lunas</option>
        </select>
        <button onclick="saveEdit(${id})" style="width:100%; padding:15px; margin-top:20px; background:var(--teal); color:#fff; border:none; border-radius:10px; font-weight:700">Simpan Perubahan</button>
        <button onclick="closeModal()" style="width:100%; margin-top:10px; border:none; background:none; color:var(--sub)">Batal</button>
    `;
}

function saveEdit(id) {
    const idx = records.findIndex(r => r.id === id);
    const old = {...records[idx]};
    const newStatus = document.getElementById('e-status').value;
    records[idx].owner = document.getElementById('e-owner').value;
    records[idx].status = newStatus;
    if (newStatus === 'done') {
        records[idx].finishDate = document.getElementById('e-date').value;
        save(`mengubah data ${old.owner}: Status menjadi Lunas (${formatDate(records[idx].finishDate)})`);
    } else {
        records[idx].date = document.getElementById('e-date').value;
        records[idx].finishDate = null;
        save(`mengubah data ${old.owner}: Status kembali ke Hutang (${formatDate(records[idx].date)})`);
    }
    closeModal();
    renderContent();
}

function markDone(id) {
    const idx = records.findIndex(r => r.id === id);
    const finishDate = document.getElementById('f-finish-date').value;
    records[idx].status = 'done';
    records[idx].finishDate = finishDate;
    save(`melunasi hutang puasa milik ${records[idx].owner} (Selesai tgl: ${formatDate(finishDate)})`);
    closeModal();
    renderContent();
}

function deleteRecord(id) {
    const item = records.find(r => r.id === id);
    if(confirm(`Hapus data hutang milik ${item.owner}?`)) {
        records = records.filter(r => r.id !== id);
        save(`menghapus data hutang puasa milik ${item.owner} (Ramadan ${item.year})`);
        renderContent();
    }
}

function exportLog() {
    if(activities.length === 0) return showToast("Tidak ada log");
    const data = activities.map(a => ({
        "Waktu": new Date(a.time).toLocaleString('id-ID'),
        "User": a.user,
        "Aksi": a.action
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Log Aktivitas");
    XLSX.writeFile(wb, "Log_Aktivitas_HutangPuasa.xlsx");
}

function sendChat() {
    const msg = document.getElementById('chat-input').value;
    if(!msg || !syncId) return;
    db.ref('sync/' + syncId + '/chats').push({ sender: myName, text: msg, time: Date.now() });
    document.getElementById('chat-input').value = '';
    document.getElementById('emoji-panel').style.display = 'none';
}

function listenChat() {
    if(!syncId) return;
    db.ref('sync/' + syncId + '/chats').on('value', (s) => {
        const chatBox = document.getElementById('chat-msgs');
        if(!chatBox) return;
        let html = '';
        s.forEach(child => {
            const m = child.val();
            const side = m.sender === myName ? 'me' : 'other';
            html += `<div class="msg ${side}"><div style="font-size:9px; font-weight:700; opacity:0.8">${m.sender}</div>${m.text}</div>`;
        });
        chatBox.innerHTML = html;
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

function applySync() {
    syncId = document.getElementById('sync-input').value.trim();
    myName = document.getElementById('name-input').value;
    localStorage.setItem('hp_sync_id', syncId);
    localStorage.setItem('hp_user_name', myName);
    if (syncId) {
        db.ref('sync/' + syncId + '/data').on('value', (s) => {
            const data = s.val();
            if(data) {
                records = data.records || [];
                profiles = data.profiles || ["Ayah", "Bunda"];
                activities = data.activities || [];
                updateStats();
                if(currentTab !== 'chat') renderContent();
            }
        });
    }
    showToast("Sinkronisasi Aktif!");
}

function addProfile() {
    const name = document.getElementById('new-prof-name').value.trim();
    if(name && !profiles.includes(name)) { profiles.push(name); save(`menambah profil baru: ${name}`); renderContent(); }
}
function removeProfile(name) { if(confirm("Hapus profil?")) { profiles = profiles.filter(p => p !== name); save(`menghapus profil: ${name}`); renderContent(); } }
function insertEmoji(e) { document.getElementById('chat-input').value += e; }
function toggleEmoji() { const p = document.getElementById('emoji-panel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
function openFinishModal(id) {
    const m = document.getElementById('modal'); m.style.display = 'flex';
    document.getElementById('modal-content').innerHTML = `<h4>Tandai Lunas</h4><label>Tanggal Selesai</label><input type="date" id="f-finish-date" value="${new Date().toISOString().split('T')[0]}"><button onclick="markDone(${id})" style="width:100%; padding:15px; margin-top:20px; background:var(--teal); color:#fff; border:none; border-radius:10px; font-weight:700">Simpan Pelunasan</button><button onclick="closeModal()" style="width:100%; margin-top:10px; border:none; background:none; color:var(--sub)">Batal</button>`;
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function formatDate(d) { return new Date(d).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}); }
function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
function exportToExcel() {
    if(records.length === 0) return showToast("Tidak ada data");
    const data = records.map(r => ({ "Pemilik": r.owner, "Tanggal": r.date, "Ramadan": r.year, "Status": r.status === 'done' ? 'Lunas' : 'Hutang', "Tgl Selesai": r.finishDate || '-', "Catatan": r.note || '' }));
    const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "HutangPuasa"); XLSX.writeFile(wb, "Hutang_Puasa.xlsx");
}
updateStats(); renderContent(); if(syncId) applySync();
</script>
</body>
</html>
